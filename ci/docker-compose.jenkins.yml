# =============================================================
#  Jenkins — servidor de Integracao Continua (CI)
#  Roda na porta 8080. Heap limitado a 512m (VM com pouca RAM).
# =============================================================
services:

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: task2-jenkins:latest
    container_name: jenkins
    restart: unless-stopped
    user: root
    environment:
      JAVA_OPTS: "-Xmx512m"
    ports:
      - "8080:8080"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkinsnet

volumes:
  jenkins-data:

networks:
  jenkinsnet:
    driver: bridge
